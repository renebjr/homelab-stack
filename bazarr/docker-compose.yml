services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    dns:
     - 1.1.1.1
     - 8.8.8.8
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./config:/config
      - ${DRIVE}:/data
    ports:
      - 6767:6767
    restart: unless-stopped
