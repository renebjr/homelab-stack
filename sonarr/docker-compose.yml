services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    dns:
     - 1.1.1.1
     - 8.8.8.8
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=America/New_York
    volumes:
      - ./config:/config
      - ${DRIVE}:/data
    ports:
      - 8989:8989
    restart: unless-stopped
